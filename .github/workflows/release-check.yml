name: Validate release version

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Validate release version
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v6
      - name: Check release validity
        run: sh .github/scripts/check-release.sh
